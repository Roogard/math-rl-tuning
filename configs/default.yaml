# =============================================================================
# Math RL Tuning — Default Configuration
# =============================================================================
# Override any value by passing a custom YAML or by setting environment variables.

# --- Paths ---
paths:
  # Where to save SFT training outputs (checkpoints, logs)
  sft_output_dir: "./outputs/sft"
  # Where to save the final merged SFT model before RL
  sft_merged_dir: "./outputs/sft_merged"
  # Where to save GRPO/RL training outputs
  grpo_output_dir: "./outputs/grpo"
  # Where to save evaluation results (JSON/CSV)
  eval_output_dir: "./outputs/eval"
  # Google Drive mount point (used only in Colab)
  drive_mount: "/content/drive"
  # Google Drive save directory (used only in Colab)
  drive_save_dir: "/content/drive/MyDrive/math-rl-tuning"

# --- Base Model ---
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 1024

# --- Quantization (QLoRA / BitsAndBytes) ---
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

# --- LoRA ---
lora:
  # SFT LoRA config
  sft:
    r: 16
    alpha: 64
    dropout: 0.05
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules: "all-linear"
  # GRPO/RL LoRA config (fresh adapter on top of merged SFT)
  # Matches official Unsloth GRPO notebook: r=32, alpha=r
  grpo:
    r: 32
    alpha: 32
    dropout: 0.0
    bias: "none"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

# --- Dataset ---
dataset:
  # GRPO dataset: GSM8K (grade school math — easier, better learning signal)
  grpo_dataset_name: "openai/gsm8k"
  # SFT dataset (unchanged)
  name: "AI-MO/NuminaMath-CoT"
  # Sources to KEEP for SFT training (cleaner, well-formatted data)
  sft_keep_sources:
    - "gsm8k"
    - "math"
    - "cn_k12"
  # Sources to DROP from test set
  test_drop_sources:
    - "olympiads"
    - "aops_forum"
    - "synthetic_math"
    - "amc_aime"
    - "synthetic_amc"
  # Sources to DROP from GRPO train set (only used if grpo_dataset_name is NuminaMath)
  grpo_drop_sources:
    - "olympiads"
    - "aops_forum"
    - "cn_k12"
    - "orca_math"
    - "synthetic_math"
    - "amc_aime"
    - "synthetic_amc"
  train_per_source: 6000
  val_per_source: 1000
  random_state: 42
  system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."
  grpo_system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."

# --- SFT Training ---
sft_training:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  # fp16/bf16: leave both false to auto-detect based on GPU capability.
  # On Ampere+ GPUs (A100, L4, etc.) bf16 is used; on older GPUs fp16 is used.
  fp16: false
  bf16: false
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 1
  logging_steps: 25
  eval_strategy: "no"
  neftune_noise_alpha: 5
  max_length: 2048
  dataset_text_field: "messages"
  completion_only_loss: true
  packing: true
  dataset_num_proc: 24
  report_to: "wandb"
  wandb_project: "AI-MONuminaMath"
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3

# --- GRPO / RL Training ---
grpo_training:
  learning_rate: 5.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.99
  warmup_ratio: 0.1
  weight_decay: 0.1
  lr_scheduler_type: "cosine"
  optim: "adamw_torch_fused"
  per_device_train_batch_size: 64
  gradient_accumulation_steps: 1
  num_generations: 4
  max_prompt_length: 256
  max_completion_length: 1024
  num_train_epochs: 1
  report_to: "wandb"
  use_vllm: false
  beta: 0.01
  grpo_sample_size: 5000
  max_grad_norm: 0.1
  logging_steps: 1
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  # Unsloth-specific
  use_unsloth: false
  gpu_memory_utilization: 0.5

# --- Reward Function ---
rewards:
  # Points for correct answer (semantic match via math-verify)
  correct_bonus: 3.0
  # Penalty for wrong answer (negative signal)
  incorrect_penalty: -1.0
  # Bonus for using \boxed{} format
  format_bonus: 0.5
  # Penalty for missing \boxed{} format
  format_penalty: -0.5
  # Bonus for clean ending with \boxed{} (no trailing text)
  strict_format_bonus: 0.5

# --- Evaluation ---
evaluation:
  num_samples: 100
  max_new_tokens: 2048
  greedy: true
  system_prompt: |
    You are an expert mathematics problem solver. Follow this process for every problem:

    1. **Understand**: Read carefully. Identify what is being asked and what information is given.
    2. **Plan**: Decide which mathematical approach to use (algebra, geometry, combinatorics, etc.).
    3. **Solve**: Execute your plan step by step. Show all work clearly.
    4. **Verify**: Check your answer. Substitute back, estimate, or solve using an alternative method.
    5. **Answer**: State your final answer inside \boxed{}. Put only the final value inside the box.

    Here are examples of the expected format and reasoning depth:

    Example 1:
    Problem: Given the function f(x) = 2x^3 - 3x^2 - 12x + 5, find the intervals where f(x) is increasing.
    Solution:
    Understand: Find where f(x) is increasing, which means f'(x) > 0.
    Plan: Compute the derivative, find critical points, test intervals.
    Solve: f'(x) = 6x^2 - 6x - 12 = 6(x^2 - x - 2) = 6(x-2)(x+1).
    Critical points: x = -1 and x = 2.
    Test intervals: f'(-2) = 6(4+2-2) = 24 > 0, f'(0) = 6(0-0-2) = -12 < 0, f'(3) = 6(9-3-2) = 24 > 0.
    Verify: f'(x) > 0 on (-∞, -1) and (2, ∞). At boundaries: f'(-1) = 0 and f'(2) = 0. ✓
    The answer is \boxed{(-\infty, -1) \cup (2, +\infty)}.

    Example 2:
    Problem: In an arithmetic sequence {a_n}, a_3 = 7 and a_7 = 19. Find the sum of the first 10 terms.
    Solution:
    Understand: Find S_10 given two terms of an arithmetic sequence.
    Plan: Use a_n = a_1 + (n-1)d to find a_1 and d, then use S_n = n/2 × (2a_1 + (n-1)d).
    Solve: a_3 = a_1 + 2d = 7 and a_7 = a_1 + 6d = 19.
    Subtracting: 4d = 12, so d = 3. Then a_1 = 7 - 6 = 1.
    S_10 = 10/2 × (2(1) + 9(3)) = 5 × 29 = 145.
    Verify: a_10 = 1 + 27 = 28. S_10 = 10/2 × (1 + 28) = 145. ✓
    The answer is \boxed{145}.

    Example 3:
    Problem: A circle has center (2, -1) and passes through the point (5, 3). Find the equation of the circle.
    Solution:
    Understand: Find the standard equation (x-h)^2 + (y-k)^2 = r^2.
    Plan: Center is given. Find r using the distance from center to the point on the circle.
    Solve: r = sqrt((5-2)^2 + (3-(-1))^2) = sqrt(9 + 16) = sqrt(25) = 5.
    Equation: (x-2)^2 + (y+1)^2 = 25.
    Verify: Check (5,3): (5-2)^2 + (3+1)^2 = 9 + 16 = 25. ✓
    The answer is \boxed{(x-2)^2 + (y+1)^2 = 25}.

    Now solve the following problem:
  batch_size: 16  # Increase to 8-16 on A100 (40GB) for faster eval

# --- Inference ---
inference:
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  do_sample: true
