

# models saved in google drive
paths:
  sft_output_dir: "./outputs/sft"
  sft_merged_dir: "./outputs/sft_merged"
  grpo_output_dir: "./outputs/grpo"
  eval_output_dir: "./outputs/eval"
  drive_mount: "/content/drive"
  drive_save_dir: "/content/drive/MyDrive/math-rl-tuning"

model:
  name: "Qwen/Qwen2.5-Math-7B"
  max_seq_length: 2048

# quantization to speed up training and reduce GPU usage since compute is a bottleneck in this project
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

#lora config since full fine-tuning is unecessary and expensive. lets us train far less parameters and still be accurace
lora:
  sft:
    r: 32
    alpha: 64
    dropout: 0.0
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
  grpo:
    r: 32
    alpha: 32
    dropout: 0.0
    bias: "none"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

dataset:
  # Dataset used for both SFT and GRPO — same sources throughout the full pipeline
  name: "AI-MO/NuminaMath-CoT"
  # Sources to KEEP for both SFT and GRPO training (cleaner, well-formatted data)
  sft_keep_sources:
    - "gsm8k"
    - "math"
    - "cn_k12"
    - "orca_math"
    - "synthetic_math"
    - "olympiads"
    - "aops_forum"
    - "amc_aime"
  # Sources to DROP from test set
  test_drop_sources:
    - "synthetic_math"
    - "synthetic_amc"
  train_per_source: 12000
  # Per-source overrides (empty = use train_per_source for all)
  train_per_source_overrides: {}
  val_per_source: 500
  random_state: 42
  system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."

# --- SFT Training ---
sft_training:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: false
  # fp16/bf16: leave both false to auto-detect based on GPU capability.
  # On Ampere+ GPUs (A100, L4, etc.) bf16 is used; on older GPUs fp16 is used.
  fp16: false
  bf16: false
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  logging_steps: 25
  eval_strategy: "steps"
  eval_steps: 500
  neftune_noise_alpha: null
  max_length: 2048
  dataset_text_field: "messages"
  completion_only_loss: true
  packing: true
  dataset_num_proc: 24
  report_to: "wandb"
  wandb_project: "AI-MONuminaMath"
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  early_stopping_patience: 3

# --- GRPO / RL Training ---
grpo_training:
  learning_rate: 5.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.99
  warmup_ratio: 0.1
  weight_decay: 0.1
  lr_scheduler_type: "cosine"
  optim: "adamw_torch_fused"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 2
  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 2048
  num_train_epochs: 1
  report_to: "wandb"
  beta: 0.01
  grpo_sample_size: 3000
  max_grad_norm: 0.3
  logging_steps: 1
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3

# --- Reward Function ---
rewards:
  # Points for correct answer (semantic match via math-verify)
  correct_bonus: 3.0
  # Penalty for wrong answer (negative signal)
  incorrect_penalty: -1.0
  # Bonus for using \boxed{} format
  format_bonus: 0.5
  # Penalty for missing \boxed{} format
  format_penalty: -0.5
  # Bonus for clean ending with \boxed{} (no trailing text)
  strict_format_bonus: 0.5

# --- Evaluation ---
evaluation:
  num_samples: 300
  max_new_tokens: 2048
  system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."
  batch_size: 16  # Increase to 8-16 on A100 (40GB) for faster eval
  # Only evaluate on sources the model was trained on (set to [] for all sources)
  eval_keep_sources:
    - "gsm8k"
    - "math"
    - "cn_k12"
    - "orca_math"
    - "synthetic_math"
    - "olympiads"
    - "aops_forum"
    - "amc_aime"

