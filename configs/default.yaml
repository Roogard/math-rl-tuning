# =============================================================================
# Math RL Tuning — Default Configuration
# =============================================================================
# Override any value by passing a custom YAML or by setting environment variables.

# --- Paths ---
paths:
  # Where to save SFT training outputs (checkpoints, logs)
  sft_output_dir: "./outputs/sft"
  # Where to save the final merged SFT model before RL
  sft_merged_dir: "./outputs/sft_merged"
  # Where to save GRPO/RL training outputs
  grpo_output_dir: "./outputs/grpo"
  # Where to save evaluation results (JSON/CSV)
  eval_output_dir: "./outputs/eval"
  # Google Drive mount point (used only in Colab)
  drive_mount: "/content/drive"
  # Google Drive save directory (used only in Colab)
  drive_save_dir: "/content/drive/MyDrive/math-rl-tuning"

# --- Base Model ---
model:
  name: "Qwen/Qwen2.5-Math-7B-Instruct"
  max_seq_length: 2048

# --- Quantization (QLoRA / BitsAndBytes) ---
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

# --- LoRA ---
lora:
  # SFT LoRA config
  sft:
    r: 32
    alpha: 64
    dropout: 0.0
    bias: "none"
    task_type: "CAUSAL_LM"
    target_modules: "all-linear"
  # GRPO/RL LoRA config (fresh adapter on top of merged SFT)
  # Matches official Unsloth GRPO notebook: r=32, alpha=r
  grpo:
    r: 32
    alpha: 32
    dropout: 0.0
    bias: "none"
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

# --- Dataset ---
dataset:
  # GRPO dataset: GSM8K (grade school math — easier, better learning signal)
  grpo_dataset_name: "openai/gsm8k"
  # SFT dataset (unchanged)
  name: "AI-MO/NuminaMath-CoT"
  # Sources to KEEP for SFT training (cleaner, well-formatted data)
  sft_keep_sources:
    - "gsm8k"
    - "math"
    - "cn_k12"
    - "orca_math"
    - "synthetic_math"
  # Sources to DROP from test set
  test_drop_sources:
    - "olympiads"
    - "aops_forum"
    - "synthetic_math"
    - "amc_aime"
    - "synthetic_amc"
  # Sources to DROP from GRPO train set (only used if grpo_dataset_name is NuminaMath)
  grpo_drop_sources:
    - "olympiads"
    - "aops_forum"
    - "cn_k12"
    - "orca_math"
    - "synthetic_math"
    - "amc_aime"
    - "synthetic_amc"
  train_per_source: 12000
  val_per_source: 500
  random_state: 42
  system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."
  grpo_system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."

# --- SFT Training ---
sft_training:
  num_train_epochs: 2
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  # fp16/bf16: leave both false to auto-detect based on GPU capability.
  # On Ampere+ GPUs (A100, L4, etc.) bf16 is used; on older GPUs fp16 is used.
  fp16: false
  bf16: false
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  logging_steps: 25
  eval_strategy: "steps"
  eval_steps: 100
  neftune_noise_alpha: null
  max_length: 2048
  dataset_text_field: "messages"
  completion_only_loss: true
  packing: true
  dataset_num_proc: 24
  report_to: "wandb"
  wandb_project: "AI-MONuminaMath"
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3

# --- GRPO / RL Training ---
grpo_training:
  learning_rate: 5.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.99
  warmup_ratio: 0.1
  weight_decay: 0.1
  lr_scheduler_type: "cosine"
  optim: "adamw_torch_fused"
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 2
  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 2048
  num_train_epochs: 1
  report_to: "wandb"
  use_vllm: false
  beta: 0.01
  grpo_sample_size: 3000
  max_grad_norm: 0.3
  logging_steps: 1
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  # Unsloth-specific
  use_unsloth: false
  gpu_memory_utilization: 0.5

# --- Reward Function ---
rewards:
  # Points for correct answer (semantic match via math-verify)
  correct_bonus: 3.0
  # Penalty for wrong answer (negative signal)
  incorrect_penalty: -1.0
  # Bonus for using \boxed{} format
  format_bonus: 0.5
  # Penalty for missing \boxed{} format
  format_penalty: -0.5
  # Bonus for clean ending with \boxed{} (no trailing text)
  strict_format_bonus: 0.5

# --- Evaluation ---
evaluation:
  num_samples: 200
  max_new_tokens: 2048
  greedy: true
  system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."
  batch_size: 16  # Increase to 8-16 on A100 (40GB) for faster eval
  # Only evaluate on sources the model was trained on (set to [] for all sources)
  eval_keep_sources:
    - "gsm8k"
    - "math"
    - "cn_k12"
    - "orca_math"
    - "synthetic_math"

# --- Inference ---
inference:
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  do_sample: true
